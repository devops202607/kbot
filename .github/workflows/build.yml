name: build

on:
  push:
    branches:
      - develop

env:
  IMAGE_NAME: ghcr.io/devops202607/kbot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set VERSION
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "VERSION=v1.0.3-${HASH}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-linux-amd64
            ${{ env.IMAGE_NAME }}:latest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm chart version
        run: |
          sed -i "s/tag: .*/tag: ${{ env.VERSION }}/" helm/kbot/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/kbot/values.yaml
          git diff --cached --quiet || git commit -m "chore: update helm chart tag to ${{ env.VERSION }}"
          git push
